<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            max-width: 600px;
            margin: auto;
        }
        h2 {
            color: #2c3e50;
        }
        p {
            color: #555;
            line-height: 1.6;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Welcome to My Blog 🎉</h2>
        <p>Hi {{ username }},</p>

        <p>
            Thanks for registering on our blog!  
            We’re excited to have you with us.
        </p>

        <p>
            Stay tuned for amazing content on technology, learning, and growth 🚀
        </p>

        <p>Happy reading,<br><strong>My Blog Team</strong></p>

        <div class="footer">
            © 2026 My Blog. All rights reserved.
        </div>
    </div>
</body>
</html>
